<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title></title>
    <script type="module" crossorigin src="/cave-to-cave-play/assets/player-C_cionSo.js"></script>
    <link rel="stylesheet" crossorigin href="/cave-to-cave-play/assets/player-wO6d0ZHu.css">
  </head>
  <body class="standalone-player">
    <main id="game-root">
      <header>
        <div class="brand">
          <span class="mark">✳</span>
          <div>
            <span id="game-title"></span><small id="game-subtitle"></small>
          </div>
        </div>
        <div class="tools">
          <div class="key-hints" id="keyboard-controls">
            <span
              ><kbd id="pause-key"></kbd>
              <span id="pause-key-hint"></span></span
            ><span
              ><kbd id="restart-key"></kbd> <span id="restart-key-hint"></span
            ></span>
          </div>
        </div>
      </header>
      <section class="viewport">
        <button id="menu-toggle" class="menu-toggle" aria-expanded="false">
          &#9776;
        </button>
        <section
          id="game-menu"
          class="game-menu"
          role="dialog"
          aria-modal="true"
          aria-labelledby="menu-title"
        >
          <div class="game-menu-panel">
            <h1 id="menu-title"></h1>
            <p id="menu-subtitle" hidden></p>
            <div id="menu-home" class="menu-view">
              <button id="menu-new-game" class="menu-primary"></button>
              <button id="menu-tutorial" hidden>Tutorial</button>
              <button id="menu-settings" hidden></button>
              <button id="menu-about"></button>
              <button
                id="menu-home-back"
                class="menu-back"
                type="button"
                hidden
              >
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path
                    d="m12 5-7 7 7 7M5 12h14"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>
            <div id="menu-levels-view" class="menu-view" hidden>
              <div id="menu-level-list" class="menu-level-list"></div>
              <button id="menu-levels-back" class="menu-back" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path
                    d="m12 5-7 7 7 7M5 12h14"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>
            <div id="menu-settings-view" class="menu-view" hidden>
              <div id="settings-fullscreen" hidden>
                <div
                  class="graphics-settings"
                  role="group"
                  aria-labelledby="fullscreen-label"
                >
                  <span id="fullscreen-label" class="graphics-label"
                    >Fullscreen</span
                  >
                  <div class="settings-switch">
                    <label
                      ><input
                        type="radio"
                        name="fullscreen"
                        value="off"
                        checked
                      /><span>Off</span></label
                    >
                    <button
                      type="button"
                      class="graphics-toggle"
                      tabindex="-1"
                      aria-label="Fullscreen"
                    ></button>
                    <label
                      ><input type="radio" name="fullscreen" value="on" /><span
                        >On</span
                      ></label
                    >
                  </div>
                </div>
              </div>
              <p id="settings-fullscreen-status" role="status" hidden></p>
              <div id="menu-graphics"></div>
              <div id="menu-touch-settings" hidden></div>
              <button id="menu-settings-back" class="menu-back" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path
                    d="m12 5-7 7 7 7M5 12h14"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>
            <div id="menu-tutorial-view" class="menu-view" hidden>
              <div
                id="tutorial-cards"
                tabindex="0"
                role="region"
                aria-label="Game basics"
              ></div>
              <button
                id="menu-tutorial-back"
                class="menu-back"
                type="button"
                aria-label="Back"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path
                    d="m12 5-7 7 7 7M5 12h14"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>
            <div id="menu-about-view" class="menu-view" hidden>
              <p id="menu-about-copy"></p>
              <p id="menu-controls"></p>
              <button id="menu-about-back" class="menu-back" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path
                    d="m12 5-7 7 7 7M5 12h14"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>
          </div>
        </section>
        <section
          id="briefing-overlay"
          role="dialog"
          aria-modal="true"
          aria-labelledby="briefing-title"
          aria-describedby="briefing-objective"
          hidden
        >
          <div class="briefing-panel">
            <h1 id="briefing-title"></h1>
            <p id="briefing-objective"></p>
            <button id="start-level" type="button">Start level</button>
          </div>
        </section>
        <div id="pause-overlay" hidden>
          <div class="pause-actions">
            <button id="resume-game" type="button" aria-label="Resume game">
              <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                <path d="M16 8 40 24 16 40Z" fill="currentColor" />
              </svg>
            </button>
          </div>
        </div>
        <div id="overlay" hidden>
          <small id="overlay-kicker"></small>
          <h1 id="overlay-title"></h1>
          <p id="overlay-copy"></p>
          <div class="result-actions">
            <button
              id="share-level"
              type="button"
              aria-label="Share level"
              title="Share level"
              hidden
            >
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <circle cx="18" cy="5" r="3" />
                <circle cx="6" cy="12" r="3" />
                <circle cx="18" cy="19" r="3" />
                <path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4" />
              </svg>
            </button>
            <button id="continue"></button>
          </div>
          <p id="share-status" role="status"></p>
        </div>
        <div class="level-caption">
          <span id="hud-level" class="hud-level"></span>
          <div class="hud-vitals">
            <svg
              class="hud-food-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <path
                fill="currentColor"
                d="M12.2 6.4C12.1 3.6 13.8 1.7 17 1c.2 3-1.6 5-4.8 5.4ZM11.4 7.6c-1.1-1-2.8-1.5-4.4-1.1C3.5 7.3 2.4 10.7 3.3 15c.8 3.9 3 7 5.6 7 1.3 0 2-0.7 3.1-0.7s1.8.7 3.1.7c2.6 0 4.8-3.1 5.6-7 .9-4.3-.2-7.7-3.7-8.5-1.6-.4-3.3.1-4.4 1.1h-1.2Z"
              />
              <path
                d="M12 8c0-2.5-.7-4.2-2-5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
            <div class="hud-resource">
              <progress
                id="hud-resource-meter"
                max="100"
                value="100"
              ></progress>
            </div>
          </div>
          <div class="hud-status">
            <strong id="hud-destination" class="hud-destination" hidden>
              <svg
                class="hud-destination-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M5 12h14M13 5l7 7-7 7"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span id="hud-destination-label"></span>
            </strong>
          </div>
        </div>
      </section>
      <touch-controls id="touch-controls" class="touch">
        <touch-joystick
          slot="movement"
          id="touch-joystick"
          mode="fixed"
          deadzone="0.15"
        ></touch-joystick>
        <div slot="actions" class="touch-actions-cluster">
          <touch-button id="action" action="action" key-code="Space" hidden>
            <span slot="icon">◆</span>
            <small id="action-label"></small>
          </touch-button>
        </div>
      </touch-controls>
      <dialog id="fullscreen-prompt" aria-labelledby="fullscreen-prompt-title">
        <h2 id="fullscreen-prompt-title">Go fullscreen?</h2>
        <button id="startup-fullscreen" type="button" autofocus>
          Enter fullscreen
        </button>
        <button id="startup-browser" type="button">
          Continue without fullscreen
        </button>
      </dialog>
    </main>
  </body>
</html>
